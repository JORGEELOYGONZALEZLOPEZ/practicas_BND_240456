function filter(){const q=search.value.trim().toLocaleLowerCase();for(const sec of root.querySelectorAll('.accordion')){const t=DATA.tables.find(x=>x.name===sec.dataset.name);const match=!q||t.name.toLocaleLowerCase().includes(q)||t.cols.some(c=>c.name.toLocaleLowerCase().includes(q));const show=(!active||active===t.name)&&match;sec.classList.toggle('hidden',!show);sec.classList.toggle('dim',!!q&&!match);if(q&&match)sec.classList.add('open')}document.querySelectorAll('.nav[data-table]').forEach(b=>b.classList.toggle('hidden',!!q&&!DATA.tables.find(t=>t.name===b.dataset.table).name.toLocaleLowerCase().includes(q)&&!DATA.tables.find(t=>t.name===b.dataset.table).cols.some(c=>c.name.toLocaleLowerCase().includes(q))))}
build();search.addEventListener('input',()=>{active=null;document.querySelectorAll('.nav').forEach(b=>b.classList.remove('active'));filter()});document.getElementById('navigation').addEventListener('click',e=>{const b=e.target.closest('[data-table]');if(b)selectTable(b.dataset.table)});root.addEventListener('click',e=>{const h=e.target.closest('.acc-head');if(h)h.parentElement.classList.toggle('open')});document.getElementById('showAll').onclick=()=>{active=null;search.value='';document.querySelectorAll('.nav').forEach(b=>b.classList.remove('active'));filter()};document.getElementById('expand').onclick=()=>root.querySelectorAll('.accordion:not(.hidden)').forEach(x=>x.classList.add('open'));document.getElementById('collapse').onclick=()=>root.querySelectorAll('.accordion').forEach(x=>x.classList.remove('open'));filter();
</script></body></html>
